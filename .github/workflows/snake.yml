name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sushan9900
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=purple,pink&color_dots=161b22,006d32,26a641,39d353&dot_size=4
            dist/snake-light.svg?color_snake=blueviolet,orchid&color_dots=ebedf0,9be9a8,40c463,30a14e,216e39&dot_size=4

      - name: Push snake SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          force_orphan: true
