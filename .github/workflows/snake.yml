# Phase 3 — Contribution Snake Workflow
# File location in your repo: .github/workflows/snake.yml
#
# ⚠️  BEFORE ADDING THIS FILE — set repo permissions first:
#     YOUR REPO Settings (not account settings) →
#     Actions → General → Workflow permissions →
#     ● Read and write permissions → Save
#
# Only add the snake <picture> block to your README *after* this
# Action runs green — the output branch doesn't exist before then.

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:           # manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2322D3EE&color_dots=%23F4F0FF,%230A101F,%2310B981,%2322D3EE,%23A78BFA,%237C3AED&background=%23F4F0FF

      - name: Generate dark snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2322D3EE&color_dots=%232d3343,%2310B981,%2322D3EE,%23A78BFA,%237C3AED&background=%230A101F

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
