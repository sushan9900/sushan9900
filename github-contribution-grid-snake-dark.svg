        <rect x="13" y="0" width="10" height="10" class="dot-l1" /><rect x="13" y="13" width="10" height="10" class="dot-empty" /><rect x="13" y="26" width="10" height="10" class="dot-l2" /><rect x="13" y="39" width="10" height="10" class="dot-l3" /><rect x="13" y="52" width="10" height="10" class="dot-empty" /><rect x="13" y="65" width="10" height="10" class="dot-l4" /><rect x="13" y="78" width="10" height="10" class="dot-l1" />
