<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <rect width="800" height="200" fill="#0d1117" rx="10"/>

  <text x="400" y="30" fill="#a855f7" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
    SMIL SVG Sanitizer Verification Spike
  </text>

  <!-- Test 1: animateMotion (Movement) -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="12">1. animateMotion (Path Movement)</text>
    <path d="M 10 30 Q 80 5 150 30 T 290 30" fill="none" stroke="#3b0764" stroke-width="3" stroke-dasharray="4"/>
    <circle r="8" fill="#6366f1">
      <animateMotion path="M 10 30 Q 80 5 150 30 T 290 30" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Test 2: animate (Color Cycle) -->
  <g transform="translate(450, 60)">
    <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="12">2. animate (Color Cycle)</text>
    <circle cx="100" cy="30" r="16" fill="#a855f7">
      <animate attributeName="fill" values="#a855f7;#06b6d4;#39d353;#a855f7" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Test 3: animate opacity (Particle Fade) -->
  <g transform="translate(50, 130)">
    <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="12">3. animate (Opacity Fade Particle)</text>
    <circle cx="100" cy="30" r="14" fill="#39d353">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Test 4: animateTransform scale (Combo Pulse) -->
  <g transform="translate(450, 130)">
    <text x="0" y="0" fill="#cbd5e1" font-family="sans-serif" font-size="12">4. animateTransform (Scale Pulse)</text>
    <g transform="translate(100, 30)">
      <rect x="-12" y="-12" width="24" height="24" fill="#f59e0b" rx="4">
        <animateTransform attributeName="transform" type="scale" values="1;1.4;1" dur="1.5s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
